<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>業務工具箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
.today{margin:8px 0 22px;padding:18px 20px;border-left:6px solid var(--ink);background:var(--panel);border-radius:0 12px 12px 0}
.today .date{color:var(--muted);font-size:14px}
.today .line{font-size:20px;font-weight:700;color:var(--ink);margin-top:4px}
.today .line.quiet{font-size:16px;font-weight:400;color:var(--muted)}
.tools{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.tool{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.tool:last-child{border-bottom:0}
a.tool:hover{background:var(--sticky)}
.tool h2{margin:0;font-size:18px;color:var(--ink)}
.tool .st{font-size:14px;text-align:right}
.tool.off h2{color:var(--muted)}
.foot{margin-top:18px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap narrow">
  <header class="top">
    <h1>業務工具箱</h1>
  </header>

  <div class="today" id="today">
    <div class="date" id="dateLine"></div>
    <div class="line quiet" id="todayLine">讀取到期資料中…</div>
  </div>

  <nav class="tools" id="tools" aria-label="工具列表"></nav>

  <p class="foot">到期追蹤的資料存在你自己的 Google 試算表；報價比較的資料只存在這台裝置。</p>
</div>

<script src="common.js"></script>
<script>
/* 工具清單：新增工具時，在這裡加一筆即可 */
const TOOLS = [
  {id:'tracker', name:'車險到期追蹤', href:'tracker.html'},
  {id:'compare', name:'車險報價比較', href:'compare.html'},
  {id:'clauses', name:'條款連結庫', href:null, note:'規劃中'}
];

const esc = TB.esc;
const wk = '日一二三四五六';
const now = new Date();
document.getElementById('dateLine').textContent = `${now.getFullYear()} 年 ${now.getMonth()+1} 月 ${now.getDate()} 日　星期${wk[now.getDay()]}`;

function renderTools(status){
  document.getElementById('tools').innerHTML = TOOLS.map(t => {
    const st = t.href ? (status[t.id] || '') : `<span class="pill m">${esc(t.note||'')}</span>`;
    return t.href
      ? `<a class="tool" href="${esc(t.href)}"><h2>${esc(t.name)}</h2><div class="st">${st}</div></a>`
      : `<div class="tool off" aria-disabled="true"><h2>${esc(t.name)}</h2><div class="st">${st}</div></div>`;
  }).join('');
}

async function loadToday(){
  const line = document.getElementById('todayLine');
  const status = {};
  if(!TB.getCfg()){
    line.textContent = '到期追蹤還沒連線，打開「車險到期追蹤」完成設定。';
    status.tracker = '<span class="pill w">未連線</span>';
    renderTools(status); return;
  }
  renderTools(status);
  try{
    const d = await TB.api('list');
    const days = d.settings.remindDays, max = Math.max(...days), min = Math.min(...days);
    const closed = ['已見面／已續保','未見面／未續保'];
    let open = 0, urgent = 0;
    d.clients.forEach(c => c.vehicles.forEach(v => {
      if(closed.includes(v.status)) return;
      const ds = [v.comp, v.vol].map(TB.daysUntil).filter(x => x != null && x <= max);
      if(!ds.length) return;
      open++; if(Math.min(...ds) <= min) urgent++;
    }));
    const prep = d.clients.filter(c => c.prep !== '已記錄').length;
    if(!open && !prep){ line.textContent = '目前沒有需要處理的到期車輛。'; }
    else {
      line.className = 'line';
      line.textContent = [open ? `${open} 台車在提醒期內` + (urgent ? `，其中 ${urgent} 台在 ${min} 天內` : '') : '', prep ? `${prep} 位客戶前置作業中` : ''].filter(Boolean).join('；');
    }
    status.tracker = urgent ? `<span class="pill n">${urgent} 台緊急</span>` : open ? `<span class="pill w">${open} 台待處理</span>` : '<span class="pill y">無待處理</span>';
  }catch(e){
    line.textContent = e.message;
    status.tracker = '<span class="pill n">連線失敗</span>';
  }
  renderTools(status);
}
loadToday();
</script>
</body>
</html>
